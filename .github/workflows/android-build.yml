name: Build Android APK (Cloud CI)

# Manual trigger only to preserve GitHub Actions minutes
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK on 16GB Cloud Runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Capacitor 8 CLI requires Node.js >= 22.0.0
      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      # 2. Capacitor 8 & AGP 8.13 specify JavaVersion.VERSION_21
      - name: Setup Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Official Gradle setup & cache
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Accept licenses and ensure Android 36 platform is available
      - name: Accept Android SDK Licenses & Verify Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        if: "${{ github.event.inputs.build_type != 'release' }}"
        uses: actions/upload-artifact@v4
        with:
          name: PersonalOS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build Android Release APK
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        if: "${{ github.event.inputs.build_type == 'release' }}"
        uses: actions/upload-artifact@v4
        with:
          name: PersonalOS-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
