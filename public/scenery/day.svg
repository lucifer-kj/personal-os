<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none" fill="none">
  <defs>
    <linearGradient id="day-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF4F6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F2EFE9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F8F5F0" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="day-ridge-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9BA8A8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F8F5F0" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="day-ridge-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6F8082" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F8F5F0" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="day-ridge-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B5E5F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F8F5F0" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1440" height="320" fill="url(#day-sky)" />

  <!-- Soft Clouds / Mist -->
  <ellipse cx="640" cy="90" rx="360" ry="40" fill="#FFFFFF" fill-opacity="0.4" filter="blur(20px)" />
  <ellipse cx="1120" cy="70" rx="280" ry="30" fill="#FFFFFF" fill-opacity="0.35" filter="blur(15px)" />

  <!-- Distant Ridge -->
  <path d="M0 200 Q 210 140 460 175 T 900 155 T 1440 160 L 1440 320 L 0 320 Z" fill="url(#day-ridge-back)" />

  <!-- Middle Ridge -->
  <path d="M0 235 Q 260 185 580 220 T 1100 195 T 1440 215 L 1440 320 L 0 320 Z" fill="url(#day-ridge-mid)" />

  <!-- Foreground Ridge -->
  <path d="M0 265 Q 190 230 420 255 T 880 238 T 1320 250 T 1440 240 L 1440 320 L 0 320 Z" fill="url(#day-ridge-front)" />
</svg>
