<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="orbGlow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F39C78"/>
      <stop offset="35%" stop-color="#D97757"/>
      <stop offset="70%" stop-color="#C96442"/>
      <stop offset="95%" stop-color="#141413" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C78" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#D97757" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C96442" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="coreBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="32" height="32" rx="7.5" fill="#141413"/>
  <rect width="31" height="31" x="0.5" y="0.5" rx="7" fill="none" stroke="#2B2A27" stroke-width="1"/>

  <!-- Atmospheric Glow Layer -->
  <circle cx="16" cy="16" r="11" fill="url(#orbGlow)" opacity="0.9"/>

  <!-- Orbital Ring 1 (Focus Latitude) -->
  <ellipse cx="16" cy="16" rx="10.5" ry="4.5" fill="none" stroke="url(#ringGrad)" stroke-width="1.1" stroke-dasharray="14 3 6 3" transform="rotate(-25 16 16)"/>

  <!-- Orbital Ring 2 (Counter Balance) -->
  <ellipse cx="16" cy="16" rx="9" ry="3.5" fill="none" stroke="#D97757" stroke-opacity="0.4" stroke-width="0.8" stroke-dasharray="8 4" transform="rotate(35 16 16)"/>

  <!-- Central Luminous Core -->
  <circle cx="16" cy="16" r="4.2" fill="#C96442" filter="url(#coreBlur)"/>
  <circle cx="16" cy="16" r="3.2" fill="#D97757"/>
  
  <!-- Specular High-Light -->
  <circle cx="14.8" cy="14.8" r="1.3" fill="#EDEAE6" opacity="0.95"/>
  <circle cx="17.2" cy="17.2" r="0.6" fill="#F39C78" opacity="0.8"/>
</svg>
